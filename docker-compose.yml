services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: devpulse
      POSTGRES_USER: devpulse
      POSTGRES_PASSWORD: changeme
    volumes:
      - ./app/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

  devpulse:
    build: ./app
    environment:
      DB_HOST: db
      DB_NAME: devpulse
      DB_USER: devpulse
      DB_PASS: changeme
      CHECK_INTERVAL_SECONDS: "30"
    depends_on:
      - db
    ports:
      - "8000:8000"
