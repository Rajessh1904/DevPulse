apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: devpulse-alerts
  namespace: devpulse-dev
  labels:
    release: prometheus
spec:
  groups:
    - name: devpulse.rules
      rules:
        - alert: DevPulseCrashLooping
          expr: rate(kube_pod_container_status_restarts_total{namespace="devpulse-dev",container="devpulse"}[15m]) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "DevPulse pod is crash-looping"

        - alert: MonitoredTargetDown
          expr: devpulse_target_up == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "A target watched by DevPulse has been down for 5+ minutes"

        - alert: HPAMaxedOut
          expr: kube_horizontalpodautoscaler_status_current_replicas{namespace="devpulse-dev"} == kube_horizontalpodautoscaler_spec_max_replicas{namespace="devpulse-dev"}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "DevPulse HPA has been at max replicas for 10+ minutes"
